<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Cup Leaderboard</title>
<style>
  /* ============================================================
     HOUSE CUP LEADERBOARD — Green Monster / Fenway styling
     PURE CSS VERSION — no JavaScript, animations run natively.
     ------------------------------------------------------------
     TO UPDATE SCORES: there is no script block. Edit the numbers
     directly in the HTML rows below (look for "EDIT SCORES HERE").
     Totals are NOT auto-calculated in this version — type the
     total into each row's total cell yourself. Rank order is set
     by the order you list the rows (top row = 1st place).
     ============================================================ */

  :root{
    --green:#1c4a2a;
    --green-dark:#143a20;
    --cream:#f4ecd0;
    --gold:#d4af37;
    --tile:#e9e0c2;
    --tile-shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--green-dark);
    font-family:Georgia,"Times New Roman",serif;
    color:var(--cream);
    padding:24px;
  }
  .board{
    max-width:820px;
    margin:0 auto;
    background:
      repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(0,0,0,.08) 38px,rgba(0,0,0,.08) 39px),
      var(--green);
    border:6px solid var(--gold);
    border-radius:8px;
    padding:26px 22px 30px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .title{
    text-align:center;
    letter-spacing:3px;
    font-size:30px;
    color:var(--gold);
    text-shadow:1px 1px 0 #000;
    margin:0 0 4px;
    text-transform:uppercase;
  }
  .subtitle{
    text-align:center;
    color:var(--cream);
    font-style:italic;
    opacity:.85;
    margin:0 0 22px;
    font-size:14px;
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold);
    padding:6px 8px;
    border-bottom:2px solid var(--gold);
    text-align:center;
  }
  thead th.house-col{text-align:left;}
  tbody tr{
    /* staggered row reveal */
    opacity:0;
    animation:rowIn .55s ease-out forwards;
  }
  tbody tr:nth-child(1){animation-delay:.15s;}
  tbody tr:nth-child(2){animation-delay:.35s;}
  tbody tr:nth-child(3){animation-delay:.55s;}
  tbody tr:nth-child(4){animation-delay:.75s;}
  tbody td{
    padding:10px 8px;
    text-align:center;
    border-bottom:1px solid rgba(0,0,0,.25);
  }
  .rank{
    font-size:22px;
    color:var(--gold);
    font-weight:bold;
    width:44px;
  }
  .house{
    text-align:left;
    font-size:19px;
    letter-spacing:1px;
  }
  /* number tile — the cream slotted card look */
  .tile{
    display:inline-block;
    min-width:38px;
    padding:6px 4px;
    background:var(--tile);
    color:#2a2a2a;
    font-weight:bold;
    font-size:20px;
    border-radius:3px;
    box-shadow:inset 0 -3px 0 var(--tile-shadow),0 2px 3px rgba(0,0,0,.4);
    /* flip-in reveal */
    transform:rotateX(-90deg);
    transform-origin:top center;
    animation:flipIn .5s ease-out forwards;
  }
  .tile.total{
    background:var(--gold);
    color:#3a2e00;
    font-size:23px;
    min-width:46px;
  }
  /* stagger tiles per column so the board flutters to life */
  tbody tr:nth-child(1) .tile{animation-delay:.45s;}
  tbody tr:nth-child(2) .tile{animation-delay:.65s;}
  tbody tr:nth-child(3) .tile{animation-delay:.85s;}
  tbody tr:nth-child(4) .tile{animation-delay:1.05s;}
  tbody td:nth-child(3) .tile{animation-duration:.55s;}
  tbody td:nth-child(4) .tile{animation-duration:.6s;}
  tbody td:nth-child(5) .tile{animation-duration:.65s;}

  @keyframes rowIn{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes flipIn{
    0%{transform:rotateX(-90deg);opacity:0;}
    60%{transform:rotateX(12deg);opacity:1;}
    100%{transform:rotateX(0);opacity:1;}
  }
  .footer{
    text-align:center;
    margin-top:20px;
    font-size:12px;
    color:var(--cream);
    opacity:.6;
    font-style:italic;
  }
</style>
</head>
<body>
  <div class="board">
    <h1 class="title">House Cup</h1>
    <p class="subtitle">Academic Year 2026&ndash;27</p>
    <table>
      <thead>
        <tr>
          <th></th>
          <th class="house-col">House</th>
          <th>Volleyball</th>
          <th>MSG&nbsp;GA</th>
          <th>Total</th>
        </tr>
      </thead>
      <!-- ============ EDIT SCORES HERE ============
           List rows in RANK ORDER (top = 1st place).
           Type each score and each total by hand.
           To add an event: add a <th> in the header above
           and a matching <td> in every row below.
      ============================================= -->
      <tbody>
        <tr>
          <td class="rank">1</td>
          <td class="house">Saguaro</td>
          <td><span class="tile">00</span></td>
          <td><span class="tile">00</span></td>
          <td><span class="tile total">00</span></td>
        </tr>
        <tr>
          <td class="rank">2</td>
          <td class="house">Agave</td>
          <td><span class="tile">00</span></td>
          <td><span class="tile">00</span></td>
          <td><span class="tile total">00</span></td>
        </tr>
        <tr>
          <td class="rank">3</td>
          <td class="house">Prickly Pear</td>
          <td><span class="tile">00</span></td>
          <td><span class="tile">00</span></td>
          <td><span class="tile total">00</span></td>
        </tr>
        <tr>
          <td class="rank">4</td>
          <td class="house">Ocotillo</td>
          <td><span class="tile">00</span></td>
          <td><span class="tile">00</span></td>
          <td><span class="tile total">00</span></td>
        </tr>
      </tbody>
    </table>
    <div class="footer">Updated after each scored event</div>
  </div>
</body>
</html>
