<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Cup Leaderboard</title>
<style>
  /* ============================================================
     HOUSE CUP LEADERBOARD  —  Green Monster / Fenway styling
     ------------------------------------------------------------
     TO UPDATE SCORES: scroll to the <script> block at the bottom.
     Everything you edit lives in the DATA section there. You do
     not need to touch any of the CSS or HTML.
     ============================================================ */

  :root {
    --monster-green:   #16543a;   /* Green Monster base */
    --monster-green-2: #0f3d2a;   /* darker panel shade */
    --tile-cream:      #f4efe1;   /* number tile face */
    --tile-shadow:     #b8b09a;   /* tile inner shadow */
    --gold:            #d4af37;    /* accent / trim */
    --ink:             #1c1c1c;    /* number ink */
    --seam:            #0a2e1f;    /* channel seams between tiles */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(circle at 50% -10%, rgba(255,255,255,0.06), transparent 55%),
      var(--monster-green-2);
    font-family: 'Arial Narrow', Arial, sans-serif;
    color: var(--tile-cream);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .board {
    width: 100%;
    max-width: 860px;
    background:
      repeating-linear-gradient(
        0deg, transparent 0 46px,
        rgba(0,0,0,0.10) 46px 48px
      ),
      var(--monster-green);
    border: 10px solid var(--seam);
    border-radius: 6px;
    box-shadow:
      0 0 0 4px var(--gold),
      0 24px 60px rgba(0,0,0,0.55),
      inset 0 0 120px rgba(0,0,0,0.4);
    padding: 28px 26px 34px;
  }

  /* ---- Header / marquee ---- */
  .marquee {
    text-align: center;
    border-bottom: 3px solid var(--gold);
    padding-bottom: 16px;
    margin-bottom: 22px;
  }
  .marquee .title {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-weight: 700;
    letter-spacing: 3px;
    font-size: clamp(24px, 5vw, 40px);
    color: var(--tile-cream);
    text-transform: uppercase;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
  }
  .marquee .subtitle {
    margin-top: 6px;
    font-size: clamp(12px, 2.4vw, 15px);
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
  }

  /* ---- Column labels ---- */
  .col-head {
    display: grid;
    grid-template-columns: 44px 1fr repeat(var(--eventcount), 60px) 84px;
    gap: 8px;
    align-items: end;
    padding: 0 6px 10px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .col-head .ev {
    text-align: center;
    line-height: 1.15;
    border-bottom: 1px solid rgba(212,175,55,0.4);
    padding-bottom: 4px;
  }
  .col-head .tot { text-align: center; font-weight: 700; }

  /* ---- House rows ---- */
  .row {
    display: grid;
    grid-template-columns: 44px 1fr repeat(var(--eventcount), 60px) 84px;
    gap: 8px;
    align-items: center;
    padding: 10px 6px;
    border-bottom: 2px solid var(--seam);
  }
  .row:last-child { border-bottom: none; }

  .rank {
    font-family: 'Georgia', serif;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    color: var(--gold);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  }
  .row.leader .rank::after {
    content: "\2605"; /* star */
    display: block;
    font-size: 12px;
    color: var(--gold);
    margin-top: -4px;
  }

  .house-name {
    font-family: 'Georgia', serif;
    font-size: clamp(16px, 3.4vw, 22px);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--tile-cream);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .swatch {
    width: 14px; height: 26px;
    border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
    flex: none;
  }

  /* ---- Number tiles (the slotted cards) ---- */
  .tile {
    background: linear-gradient(180deg, #fffdf6 0%, var(--tile-cream) 55%, #e7e0cd 100%);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    font-weight: 700;
    text-align: center;
    border-radius: 3px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.9),
      inset 0 -3px 5px var(--tile-shadow),
      0 2px 4px rgba(0,0,0,0.4);
    border: 1px solid #cfc7b2;
  }
  .tile.event { height: 40px; line-height: 40px; font-size: 20px; }
  .tile.total {
    height: 52px; line-height: 52px; font-size: 30px;
    background: linear-gradient(180deg, #fff9e0 0%, #f3e6b8 55%, #e4d089 100%);
    border-color: var(--gold);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.9),
      inset 0 -3px 6px #c9ad55,
      0 0 0 1px var(--gold),
      0 3px 6px rgba(0,0,0,0.45);
  }

  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(244,239,225,0.55);
    text-transform: uppercase;
  }

  @media (max-width: 560px) {
    .col-head .ev { font-size: 9px; }
    .tile.event { font-size: 16px; }
    .tile.total { font-size: 24px; }
  }
</style>
</head>
<body>
  <div class="board" id="board">
    <div class="marquee">
      <div class="title">House Cup</div>
      <div class="subtitle" id="ay-label">Academic Year 2026&ndash;27</div>
    </div>
    <div class="col-head" id="col-head"></div>
    <div id="rows"></div>
    <div class="footer">Standings update after each event</div>
  </div>

<script>
/* ============================================================
   DATA  —  THIS IS THE ONLY PART YOU EDIT
   ------------------------------------------------------------
   1. EVENTS: add a new {name, date} object each time you run an
      event. Order matters — left to right on the board.
   2. HOUSES: put each house's score for every event in the
      "scores" array, in the SAME ORDER as EVENTS above.
      The Total column is calculated automatically — don't
      hand-total it.
   3. Save the file and reload the page. That's it.
   ============================================================ */

  const ACADEMIC_YEAR = "Academic Year 2026\u201327";

  const EVENTS = [
    { name: "Volleyball", date: "7/19/26" },
    { name: "MSG GA",     date: "7/21/26" }
    // { name: "Next Event", date: "MM/DD/YY" },   <-- add here
  ];

  const HOUSES = [
    { name: "Ocotillo",     color: "#c0562c", scores: [5, 31] },
    { name: "Prickly Pear", color: "#7d9a3f", scores: [7, 23] },
    { name: "Agave",        color: "#4a8a7b", scores: [0, 29] },
    { name: "Saguaro",      color: "#3f7d4a", scores: [3, 25] }
    // { name: "House",     color: "#hex",    scores: [0, 0] },  <-- add scores in EVENTS order
  ];

/* ============================================================
   RENDER + ANIMATION  —  no need to edit below this line
   ============================================================ */

  // Total = sum of that house's event scores
  HOUSES.forEach(h => h.total = h.scores.reduce((a, b) => a + b, 0));
  // Sort highest total first
  HOUSES.sort((a, b) => b.total - a.total);

  const root = document.documentElement;
  root.style.setProperty('--eventcount', EVENTS.length);
  document.getElementById('ay-label').innerHTML = ACADEMIC_YEAR;

  // Column headers
  let head = `<div></div><div style="align-self:end;color:#d4af37;letter-spacing:1px;">HOUSE</div>`;
  EVENTS.forEach(e => {
    head += `<div class="ev">${e.name}<br><span style="opacity:.7">${e.date}</span></div>`;
  });
  head += `<div class="tot">TOTAL</div>`;
  document.getElementById('col-head').innerHTML = head;

  // Rows
  const rowsEl = document.getElementById('rows');
  HOUSES.forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (i === 0 ? ' leader' : '');
    let cells = `<div class="rank">${i + 1}</div>`;
    cells += `<div class="house-name"><span class="swatch" style="background:${h.color}"></span>${h.name}</div>`;
    h.scores.forEach(s => {
      cells += `<div class="tile event" data-value="${s}">0</div>`;
    });
    cells += `<div class="tile total" data-value="${h.total}">0</div>`;
    row.innerHTML = cells;
    rowsEl.appendChild(row);
  });

  // Count-up animation (scoreboard roll)
  function animateTile(el, target, duration, delay) {
    const start = performance.now() + delay;
    function frame(now) {
      if (now < start) { requestAnimationFrame(frame); return; }
      const t = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);           // ease-out cubic
      el.textContent = Math.round(eased * target);
      if (t < 1) requestAnimationFrame(frame);
      else el.textContent = target;
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('load', () => {
    document.querySelectorAll('.tile').forEach((el, idx) => {
      const target = parseInt(el.dataset.value, 10);
      const isTotal = el.classList.contains('total');
      animateTile(el, target, isTotal ? 1100 : 800, idx * 55);
    });
  });
</script>
</body>
</html>
